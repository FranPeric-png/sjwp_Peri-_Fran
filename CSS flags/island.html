<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .blue {
        position: relative;
        width: 500px;
        height: 300px;
        background-color: rgb(6, 35, 131);
      }
      .white {
        position: relative;
        top: 100px;
        left: 0px;
        width: 500px;
        height: 100px;
        z-index: 100;
        background-color: rgb(255, 255, 255);
      }
      .white2 {
        position: relative;
        top: 0px;
        left: 0px;
        width: 500px;
        height: 100px;
        background-color: rgb(248, 248, 248);
      }

      .red {
        position: absolute;
        top: -200px;
        left: 100px;
        width: 50px;
        height: 300px;
        background-color: rgb(145, 15, 10);
      }
      .red2 {
        position: absolute;
        top: -375px;
        left: 0px;
        width: 500px;
        height: 50px;
        length: 500px;
        background-color: rgb(138, 8, 8);
      }
    </style>
  </head>
  <body>
    <div class="blue">
      <div class="white"></div>
      <div class="white2"></div>

      <div class="red"></div>

      <div class="red2"></div>
    </div>
  </body>
</html>
