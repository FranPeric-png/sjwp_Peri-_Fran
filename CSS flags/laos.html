<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zastava Laosa</title>
    <style>
      .relative {
        position: relative;
        width: 500px;
        height: 300px;
        background-color: rgb(168, 5, 5);
      }

      .absolute {
        position: absolute;
        top: 100px;
        left: 200px;
        width: 100px;
        height: 100px;
        border-radius: 100%;
        z-index: 100;
        background-color: rgb(255, 255, 255);
      }
      .absolute2 {
        position: absolute;
        width: 500px;
        height: 200px;
        left: 0px;
        top: 50px;

        background-color: rgb(0, 0, 168);
      }
    </style>
  </head>
  <body>
    <div class="relative">
      <div class="absolute"></div>
      <div class="absolute2"></div>
    </div>
  </body>
</html>
