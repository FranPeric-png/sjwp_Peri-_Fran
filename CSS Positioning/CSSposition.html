<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .relative {
      position: relative;
      width: 500px;
      height: 300px;
      background-color: lightblue;
    }

    .absolute {
      position: absolute;
      top: 5px;
      left: 200px;
      width: 100px;
      height: 100px;
      background-color: chocolate;
    }
  </style>
</head>
<body>
  <div class="relative">
    <div class="absolute">
      <p>Absolute</p>
    </div>
    </div>
  </div>



</body>
</html>
